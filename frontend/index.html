<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f7f7fb" />
    <script>
      // Resolve before the application and its styles load to avoid a light first frame.
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('rd:theme');
          if (saved === 'light' || saved === 'dark') preference = saved;
        } catch {}
        const dark =
          preference === 'dark' ||
          (preference === 'system' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
        const theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#07080f' : '#f7f7fb');
      })();
    </script>
    <meta name="description" content="让每一段真实经历，都找到对应的岗位证据。" />
    <title>ResumeDoctor · 简历诊断</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
