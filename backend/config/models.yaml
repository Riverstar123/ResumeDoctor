# 受控真实模型目录（AI-02/AI-03）。本文件进入 Git，不得写入密钥或真实端点。
# 条目只声明“读取哪个服务端环境变量”；实际值由组长/部署者在 backend/.env 填写。
#
# version 会写入任务的 model_metadata.gateway_config_version。修改实际模型、端点或
# 能力后必须同时修改 version，使冻结快照能发现映射变化，而不是静默换模型。
#
# providers：把公开供应商标签映射到适配器协议（均为 OpenAI-compatible Chat
# Completions，但端点与密钥各自独立；切换模型只能访问对应供应商）。
version: models-v5
default_model_id: real-default
providers:
  deepseek:
    protocol: openai_compatible
  bigmodel:
    protocol: openai_compatible
models:
  # DeepSeek 默认条目：引用 LLM_MODEL / LLM_BASE_URL / LLM_API_KEY；缺一不可。
  # 单模型配置（只填这三个变量）即可完成 smoke test，第二家未填写不影响本条目。
  - id: real-default
    display_name: DeepSeek（默认模型）
    provider: deepseek
    capabilities:
      - profile_extract
      - profile_chat
      - job_extract
      - diagnosis_report
    enabled: true
    model_env: LLM_MODEL
    base_url_env: LLM_BASE_URL
    api_key_env: LLM_API_KEY
    # Bounded extraction/report JSON uses non-thinking mode; the report still
    # requires a separate evidence review. Other actual model names stay unchanged.
    thinking_by_model:
      deepseek-flash: disabled
    structured_output_by_model:
      deepseek-flash: deepseek_strict

  # DeepSeek 备用型号：模型名单独填写，端点/凭证与默认条目相同。
  # 与 real-default 构成同供应商两个实际模型，可做同快照换模型平分验收。
  - id: real-model-a
    display_name: DeepSeek（备用型号）
    provider: deepseek
    capabilities:
      - profile_extract
      - profile_chat
      - job_extract
      - diagnosis_report
    enabled: true
    model_env: LLM_MODEL_A
    base_url_env: LLM_BASE_URL
    api_key_env: LLM_API_KEY
    thinking_by_model:
      deepseek-flash: disabled
    structured_output_by_model:
      deepseek-flash: deepseek_strict

  # 智谱 BigModel（GLM）：端点与密钥独立填写（LLM_*_B），未填写时条目省略，
  # 不会被解析成 DeepSeek，也不允许把 DeepSeek 凭证发到该端点。
  - id: real-model-b
    display_name: 智谱 GLM（BigModel）
    provider: bigmodel
    capabilities:
      - profile_extract
      - profile_chat
      - job_extract
      - diagnosis_report
    enabled: true
    model_env: LLM_MODEL_B
    base_url_env: LLM_BASE_URL_B
    api_key_env: LLM_API_KEY_B
    # GLM-5.3 always thinks; low leaves room for the validated JSON within the
    # existing 3,000-token budget. Other actual model names keep their defaults.
    reasoning_effort_by_model:
      glm-5.3: low
