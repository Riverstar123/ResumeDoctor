[project]
name = "resumedoctor-backend"
version = "0.1.0"
description = "ResumeDoctor shared contracts and minimal backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.0",
  "pydantic-settings==2.15.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "pypdf==6.21.0",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
database = ["sqlalchemy==2.1.4", "alembic==1.20.0", "psycopg[binary]==3.3.6"]

[dependency-groups]
dev = [
  "pytest==9.1.1", "httpx==0.28.1", "jsonschema==4.26.0",
  "openapi-spec-validator==0.9.0", "ruff==0.17.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
required-version = "==0.11.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
